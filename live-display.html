<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>markenbaumarkt24-Cup 2026 – Live auf dem Platz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#b51014;
    --navy-dark:#6c0a0c;
    --accent:#b51014;
    --bg:#eeeeee;
    --card:#ffffff;
    --text:#222;
    --muted:#6b6b6b;
    --border:#e0e0e0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
    padding:1.6vh 2vw 1.3vh;
    text-align:left;
  }
  .header-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1vw;
  }
  .title{
    font-size:clamp(2.1rem,4.4vw,4.6rem);
    font-weight:800;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .clock{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.05;
    flex-shrink:0;
  }
  .clock .time{
    font-size:clamp(1.5rem,2.8vw,2.8rem);
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .clock .date{
    font-size:clamp(0.7rem,0.9vw,1rem);
    opacity:0.85;
  }
  .subtitle{
    margin-top:0.3vh;
    font-size:clamp(0.8rem,1.1vw,1.2rem);
    opacity:0.9;
  }
  .section-wrap{
    padding:1vh 2vw 0;
  }
  .section-heading{
    display:flex;
    align-items:center;
    gap:0.8vw;
    margin-bottom:1vh;
  }
  .live-dot{
    width:1.2vw;height:1.2vw;max-width:18px;max-height:18px;
    border-radius:50%;
    background:var(--navy);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(181,16,20,0.6);}
    70%{box-shadow:0 0 0 1vw rgba(181,16,20,0);}
    100%{box-shadow:0 0 0 0 rgba(181,16,20,0);}
  }
  .section-heading h2{
    font-size:clamp(1.3rem,2vw,2rem);
    font-weight:700;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .demo-badge{
    margin-left:auto;
    background:#fff;
    border:0.15vh solid var(--navy);
    color:var(--navy);
    padding:0.4vh 1.2vw;
    border-radius:999px;
    font-size:clamp(0.75rem,1vw,1.05rem);
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  main{
    flex:1;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:1.2vh 1vw;
    padding:0 2vw 1.4vh;
    overflow:hidden;
    min-height:0;
  }
  .match-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:1.2vh;
    padding:1.2vh 1.4vw;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0.6vh;
    overflow:hidden;
    min-height:0;
    box-shadow:0 0.2vh 0.6vh rgba(0,0,0,0.06);
  }
  .match-card-empty{
    align-items:center;
    justify-content:center;
    background:#f6f6f6;
  }
  .court-badge{
    background:var(--navy);
    color:#fff;
    font-weight:800;
    font-size:clamp(1.2rem,2.2vw,2.1rem);
    padding:0.4vh 1.2vw;
    border-radius:999px;
    letter-spacing:0.02em;
  }
  .meta-top{
    min-height:2.3em;
    width:100%;
  }
  .competition{
    font-size:clamp(0.75rem,1vw,1.05rem);
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
  }
  .round{
    font-size:clamp(0.75rem,0.9vw,1rem);
    color:var(--muted);
  }
  .players{
    display:flex;
    flex-direction:column;
    width:100%;
  }
  .players .player:first-child{
    min-height:2.1em;
    display:flex;
    align-items:flex-start;
  }
  .player{
    font-size:clamp(1.8rem,6.4vh,4.4rem);
    font-weight:800;
    line-height:1.02;
    word-break:break-word;
    color:var(--text);
  }
  .vs{
    font-size:clamp(0.9rem,1.6vh,1.25rem);
    color:var(--muted);
    font-weight:600;
    margin:0.1vh 0;
  }
  .match-meta{
    margin-top:auto;
    padding-top:0.4vh;
    font-size:clamp(0.85rem,1.6vh,1.25rem);
    color:var(--muted);
    font-weight:600;
  }
  .court-empty{
    font-size:clamp(1.2rem,2.6vh,1.8rem);
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-style:italic;
    margin-top:1vh;
  }
  .empty-state{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.2rem,1.8vw,1.8rem);
    color:var(--muted);
    font-style:italic;
  }
  footer{
    text-align:center;
    padding:0.8vh 0 1vh;
    font-size:clamp(0.75rem,0.95vw,1rem);
    color:var(--muted);
  }

  .menu-ticker{
  display:flex;
  align-items:center;
  gap:1.2vw;
  background:linear-gradient(135deg,var(--navy),var(--navy-dark));
  color:#fff;
  padding:1.4vh 2vw;
  overflow:hidden;
  }
.menu-ticker[hidden]{
display:none;
}
  .menu-ticker-label{
  flex-shrink:0;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.04em;
font-size:clamp(2.25rem,3vw,3.15rem);
  background:rgba(255,255,255,0.15);
  padding:0.8vh 1.4vw;
  border-radius:999px;
  white-space:nowrap;
  }
  .menu-ticker-track{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  }
  .menu-ticker-content{
  display:inline-block;
  white-space:nowrap;
  font-size:clamp(2.55rem,3.6vw,3.75rem);
  font-weight:600;
  padding-left:100%;
  animation:ticker-scroll 30s linear infinite;
  }
  @keyframes ticker-scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-100%); }
  }
.info-qr-bar{
display:flex;
align-items:center;
gap:1.4vw;
background:var(--card);
color:var(--navy);
padding:0.8vh 2vw;
border-top:1px solid var(--border);
}
.info-qr-bar img{
width:6.5vh;
height:6.5vh;
min-width:56px;
min-height:56px;
background:#fff;
border-radius:8px;
padding:4px;
flex-shrink:0;
}
.info-qr-bar span{
font-weight:700;
font-size:clamp(1.1rem,1.6vw,1.6rem);
}
</style>
</head>
<body>
  <header>
    <div class="header-row">
      <span class="title">markenbaumarkt24-Cup 2026</span>
      <span class="clock">
        <span class="time" id="clock-time">--:--</span>
        <span class="date" id="clock-date">--</span>
      </span>
    </div>
    <div class="subtitle">17. Wilgersdorfer LK-Turnier · TC Wilgersdorf</div>
  </header>

  <div class="section-wrap">
    <div class="section-heading">
      <span class="live-dot"></span>
      <h2>Jetzt auf dem Platz</h2>
      <span class="demo-badge" id="demo-badge" hidden>Beispieldaten</span>
    </div>
  </div>

  <main id="matches">
    <div class="empty-state">Lade Daten…</div>
  </main>

<div class="menu-ticker" id="menu-ticker" hidden>
<span class="menu-ticker-label">Speiseplan heute</span>
<div class="menu-ticker-track"><div class="menu-ticker-content" id="menu-ticker-content"></div></div>
</div>

<div class="info-qr-bar">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fwww.tcwilgersdorf.de%2Fmb-cup-2026" alt="QR-Code zur MB-Cup-Seite" loading="lazy">
<span>Alle Infos rund um den markenbaumarkt24-Cup 2026</span>
</div>

  <footer>Aktualisiert automatisch · <span id="last-updated">--</span></footer>

  <script src="assets/live.js"></script>
</body>
</html>
