<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>markenbaumarkt24-Cup 2026 – Live auf dem Platz (Mobil)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--navy:#b51014;
--navy-dark:#6c0a0c;
--bg:#eeeeee;
--card:#ffffff;
--text:#222;
--muted:#6b6b6b;
--border:#e0e0e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{
width:100%;
background:var(--bg);
color:var(--text);
font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
min-height:100vh;
min-height:100dvh;
display:flex;
flex-direction:column;
}
header{
position:sticky;
top:0;
z-index:10;
background:linear-gradient(135deg,var(--navy),var(--navy-dark));
color:#fff;
padding:calc(0.7rem + env(safe-area-inset-top)) 1rem 0.7rem;
padding-left:calc(1rem + env(safe-area-inset-left));
padding-right:calc(1rem + env(safe-area-inset-right));
box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.title{
font-size:1.05rem;
font-weight:800;
letter-spacing:0.01em;
}
.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:0.6rem;
margin-top:0.35rem;
}
.section-heading{
display:flex;
align-items:center;
gap:0.45rem;
min-width:0;
}
.live-dot{
width:9px;height:9px;flex-shrink:0;
border-radius:50%;
background:#fff;
animation:pulse 1.4s infinite;
}
@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(255,255,255,0.6);}
70%{box-shadow:0 0 0 8px rgba(255,255,255,0);}
100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
}
.section-heading h2{
font-size:0.85rem;
font-weight:700;
color:#fff;
text-transform:uppercase;
letter-spacing:0.03em;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.clock{
display:flex;
flex-direction:column;
align-items:flex-end;
line-height:1.15;
flex-shrink:0;
}
.clock .time{
font-size:1.05rem;
font-weight:700;
font-variant-numeric:tabular-nums;
}
.clock .date{
font-size:0.65rem;
opacity:0.85;
white-space:nowrap;
}
.demo-badge{
margin-top:0.5rem;
display:inline-block;
background:#fff;
border:1px solid var(--navy);
color:var(--navy);
padding:0.2rem 0.8rem;
border-radius:999px;
font-size:0.75rem;
font-weight:700;
letter-spacing:0.02em;
text-transform:uppercase;
}
main{
flex:1;
display:flex;
flex-direction:column;
gap:0.9rem;
padding:1rem;
padding-left:calc(1rem + env(safe-area-inset-left));
padding-right:calc(1rem + env(safe-area-inset-right));
}
.match-card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:1rem 1.1rem 1.1rem;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.match-card-empty{
text-align:center;
background:#f6f6f6;
}
.match-card-upcoming{
background:#fbfbfb;
border-style:dashed;
border-color:var(--navy);
}
.court-badge{
display:inline-block;
background:var(--navy);
color:#fff;
font-weight:800;
font-size:1.05rem;
padding:0.3rem 0.9rem;
border-radius:999px;
letter-spacing:0.02em;
}
.upcoming-label{
display:inline-block;
margin-left:0.5rem;
background:var(--navy-dark);
color:#fff;
font-weight:800;
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:0.03em;
padding:0.3rem 0.7rem;
border-radius:999px;
vertical-align:middle;
}
.meta-top{
margin-top:0.6rem;
}
.competition{
font-size:0.9rem;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.02em;
font-weight:600;
}
.match-time{
display:flex;
align-items:center;
gap:0.5em;
font-size:0.85rem;
color:var(--muted);
font-weight:600;
margin-top:0.25rem;
}
.time-divider{
width:1px;
height:1em;
background:var(--muted);
opacity:0.5;
}
.players{
display:flex;
flex-direction:column;
margin-top:0.7rem;
}
.player{
font-size:1.3rem;
font-weight:800;
line-height:1.25;
padding:0.5rem 0;
word-break:break-word;
}
.players .player + .player{
border-top:1px solid var(--border);
}
.player-lk{
font-size:0.65em;
font-weight:600;
color:var(--muted);
margin-left:0.4em;
}
.player-club{
display:block;
font-size:0.8rem;
font-weight:600;
color:var(--muted);
margin-top:0.15rem;
}
.court-empty{
font-size:0.95rem;
color:var(--muted);
font-weight:600;
text-transform:uppercase;
letter-spacing:0.03em;
font-style:italic;
padding:0.5rem 0;
}
.empty-state{
text-align:center;
padding:3rem 1rem;
color:var(--muted);
font-style:italic;
}
footer{
text-align:center;
padding:0.9rem 1rem calc(1rem + env(safe-area-inset-bottom));
font-size:0.75rem;
color:var(--muted);
}
footer a{
color:var(--navy);
text-decoration:none;
font-weight:600;
}
</style>
</head>
<body>
<header>
<div class="title">markenbaumarkt24-Cup 2026</div>
<div class="header-row">
<div class="section-heading">
<span class="live-dot"></span>
<h2>Jetzt auf dem Platz</h2>
</div>
<span class="clock">
<span class="time" id="clock-time">--:--</span>
<span class="date" id="clock-date">--</span>
</span>
</div>
<span class="demo-badge" id="demo-badge" hidden>Beispieldaten</span>
</header>

<main id="matches">
<div class="empty-state">Lade Daten…</div>
</main>
<footer>Aktualisiert automatisch · <span id="last-updated">--</span><br><a href="live-display.html">Zur Vollbild-Anzeige</a></footer>

<script src="assets/live.js?v=4"></script>
</body>
</html>
