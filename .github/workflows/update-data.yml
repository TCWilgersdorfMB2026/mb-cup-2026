name: tennis.de Daten aktualisieren

# WICHTIG: Automatischer 30-Minuten-Cron bis zur Auslosung am 11.08.2026, 18:00 Uhr vorübergehend AUSGESCHALTET, damit die Demo-/Beispieldaten (Ticker, Ergebnisse, Berichte, Speiseplan) für eine Kundenpräsentation nicht durch einen automatischen Scrape-Lauf überschrieben werden (tennis.de liefert vor der Auslosung ohnehin nur leere Paarungen zurück). Nach der Auslosung (11.08.2026, 18:00 Uhr) hier wieder einen "schedule:"-Block mit "- cron: '*/30 * * * *'" ergänzen, um den automatischen Lauf zu reaktivieren.
on:
  workflow_dispatch:
    inputs:
      test_tournament_id:
        description: >-
          Optional: tennis.de Turnier-ID eines ANDEREN Turniers zu Testzwecken
          (z.B. um die Tableau-/Ergebnis-Logik an einem bereits
          abgeschlossenen Turnier zu prüfen). Leer lassen für den normalen
          MB-Cup-Lauf. Bei Angabe werden nur test-*.json Dateien geschrieben,
          die echten Daten bleiben unangetastet.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: tennis.de auslesen
        run: npm run scrape
        env:
          TENNIS_DE_USERNAME: ${{ secrets.TENNIS_DE_USERNAME }}
          TENNIS_DE_PASSWORD: ${{ secrets.TENNIS_DE_PASSWORD }}
          TEST_TOURNAMENT_ID: ${{ github.event.inputs.test_tournament_id }}

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "mb-cup-bot"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatisches Update: Spielplan/Ergebnisse von tennis.de"
            git push
          else
            echo "Keine Änderungen gefunden."
          fi
