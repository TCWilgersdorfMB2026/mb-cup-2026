name: tennis.de Daten aktualisieren

# Automatischer 5-Minuten-Cron - laeuft ganztaegig, unabhaengig von der Live-Anzeige (siehe update-nuliga-live.yml fuer deren eigenen 5-Minuten-Cron 8-18 Uhr).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_tournament_id:
        description: >-
          Optional: tennis.de Turnier-ID eines ANDEREN Turniers zu Testzwecken
          (z.B. um die Tableau-/Ergebnis-Logik an einem bereits
          abgeschlossenen Turnier zu prüfen). Leer lassen für den normalen
          MB-Cup-Lauf. Bei Angabe werden nur test-*.json Dateien geschrieben,
          die echten Daten bleiben unangetastet.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: tennis.de auslesen
        run: npm run scrape
        env:
          TENNIS_DE_USERNAME: ${{ secrets.TENNIS_DE_USERNAME }}
          TENNIS_DE_PASSWORD: ${{ secrets.TENNIS_DE_PASSWORD }}
          TEST_TOURNAMENT_ID: ${{ github.event.inputs.test_tournament_id }}

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "mb-cup-bot"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatisches Update: Spielplan/Ergebnisse von tennis.de"
            # Bei mehreren parallel laufenden/ueberlappenden Scraper-Laeufen (5-Minuten-
            # Cron, Laufzeit oft laenger als 4 Minuten) kann "git push" fehlschlagen,
            # weil zwischenzeitlich ein anderer Lauf bereits gepusht hat ("fetch first").
            # Deshalb vor jedem Push-Versuch die neuesten Aenderungen per Rebase holen
            # und bei einem Fehlschlag mit kurzer Pause bis zu 5x erneut versuchen,
            # statt den ganzen Workflow-Lauf fehlschlagen zu lassen.
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              echo "Push fehlgeschlagen (Versuch $i von 5) - erneuter Versuch in 5s..."
              sleep 5
            done
          else
            echo "Keine Änderungen gefunden."
          fi
